<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>新建标签页</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#080a0f;
  --bg-glow-1:#4d6cff;
  --bg-glow-2:#12b8a6;
  --bg-glow-3:#a855f7;
  --text:#e9edf6;
  --text-soft:#b9c1d4;
  --muted:#828ca4;
  --card:rgba(255,255,255,.045);
  --card-hover:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.19);
  --field:rgba(255,255,255,.055);
  --accent:#7ea6ff;
  --accent-ink:#0b1020;
  --danger:#ff6b6b;
  --shadow:0 22px 48px -22px rgba(0,0,0,.8);
  --radius:18px;
  --radius-sm:12px;
  --mono-alpha:.92;
}
[data-theme="light"]{
  --bg:#eef1f8;
  --bg-glow-1:#9db4ff;
  --bg-glow-2:#8fe3d8;
  --bg-glow-3:#d7b3ff;
  --text:#111827;
  --text-soft:#3f4757;
  --muted:#6b7280;
  --card:rgba(255,255,255,.78);
  --card-hover:#fff;
  --border:rgba(17,24,39,.09);
  --border-strong:rgba(17,24,39,.2);
  --field:rgba(255,255,255,.9);
  --accent:#2f6bff;
  --accent-ink:#fff;
  --danger:#dc2626;
  --shadow:0 20px 40px -26px rgba(17,24,39,.45);
  --mono-alpha:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:background .35s ease,color .35s ease;
  overflow-x:hidden;
}
/* ---------- ambient background ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;
  animation:float 26s ease-in-out infinite;
}
.aurora span:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-18vw;background:var(--bg-glow-1)}
.aurora span:nth-child(2){width:44vw;height:44vw;right:-12vw;top:6vh;background:var(--bg-glow-2);animation-delay:-8s}
.aurora span:nth-child(3){width:38vw;height:38vw;left:22vw;bottom:-18vw;background:var(--bg-glow-3);animation-delay:-16s}
[data-theme="light"] .aurora span{opacity:.5}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(3vw,-3vh,0) scale(1.09)}
  66%{transform:translate3d(-3vw,3vh,0) scale(.95)}
}
.shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:1280px;margin:0 auto;padding:22px 30px 46px}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand i{width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent);display:block}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text-soft);
  font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:.2s ease;
}
.icon-btn:hover{background:var(--card-hover);border-color:var(--border-strong);color:var(--text);transform:translateY(-1px)}
.icon-btn svg{width:16px;height:16px;display:block}
.icon-btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.icon-btn.primary:hover{filter:brightness(1.08)}
.icon-btn.danger-ghost{color:var(--danger);border-color:transparent;background:transparent}
.icon-btn.danger-ghost:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:transparent}

/* ---------- hero ---------- */
.hero{text-align:center;padding:44px 0 52px}
.clock{
  font-size:clamp(48px,7.6vw,86px);line-height:1;font-weight:200;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 55%,transparent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.clock small{font-size:.36em;font-weight:400;letter-spacing:.02em;margin-left:.28em;
  background:none;-webkit-text-fill-color:var(--muted);color:var(--muted)}
.hero-sub{margin-top:14px;color:var(--text-soft);font-size:15px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.hero-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.greet{color:var(--text);font-weight:600}

/* ---------- search ---------- */
.search{max-width:620px;width:100%;margin:0 auto 22px;position:relative}
.search svg.mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;height:52px;padding:0 46px 0 48px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);color:var(--text);
  font-size:15px;font-family:inherit;outline:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:.2s ease;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--card-hover);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.search .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
  border:0;background:transparent;color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center}
.search.has-value .clear{display:flex}
.search .clear:hover{background:var(--card-hover);color:var(--text)}
.search .hint{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);
  border:1px solid var(--border);border-radius:6px;padding:2px 6px;pointer-events:none}
.search.has-value .hint{display:none}

/* ---------- grid ---------- */
/* 弹性行布局：卡片宽度在 196~240px 之间自适应，整行（含不满的最后一行）居中。
   卡片少时不会挤在左侧留出大片空白，卡片多时自动换行，列数随窗口宽度变化 */
.grid{
  display:flex;flex-wrap:wrap;gap:20px;
  justify-content:center;align-content:flex-start;
}
.tile-wrap,.add-tile{flex:1 1 196px;max-width:240px}
.tile-wrap{position:relative;display:block}
.tile-wrap.hidden{display:none}
.tile{
  position:relative;display:block;text-decoration:none;color:inherit;
  border-radius:var(--radius);padding:10px 10px 12px;
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),background .22s ease,border-color .22s ease,box-shadow .22s ease,opacity .2s ease;
  cursor:pointer;
}
.tile-wrap:hover .tile{transform:translateY(-4px);background:var(--card-hover);border-color:var(--border-strong);box-shadow:var(--shadow)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tile-wrap.dragging .tile{opacity:.35;transform:scale(.97) rotate(.6deg);cursor:grabbing}
.tile-wrap.drop-before .tile{box-shadow:-6px 0 0 -1px var(--accent)}
.tile-wrap.drop-after .tile{box-shadow:6px 0 0 -1px var(--accent)}

.thumb{
  position:relative;aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;
  background:#0b0e14;isolation:isolate;
}
[data-theme="light"] .thumb{background:#dfe4ee}
.thumb-bg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 130% at 22% -10%, hsl(var(--hue,220) 72% 46% / .6), transparent 62%),
    linear-gradient(145deg, hsl(calc(var(--hue,220) + 24) 52% 24%), hsl(var(--hue,220) 48% 9%));
}
[data-theme="light"] .thumb-bg{
  background:
    radial-gradient(120% 130% at 22% -10%, hsl(var(--hue,220) 90% 74% / .95), transparent 66%),
    linear-gradient(145deg, hsl(var(--hue,220) 74% 90%), hsl(calc(var(--hue,220) + 30) 62% 83%));
}
.monogram{
  font-size:clamp(26px,3.1vw,40px);font-weight:700;letter-spacing:.02em;
  color:hsl(var(--hue,220) 92% 90%);opacity:var(--mono-alpha);
  text-shadow:0 6px 22px hsl(var(--hue,220) 60% 4% / .5);
  user-select:none;
}
[data-theme="light"] .monogram{color:hsl(var(--hue,220) 62% 34%);text-shadow:none}
.thumb-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb-img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .45s ease;
}
.thumb-img.loaded{opacity:1}
.thumb.mode-icon .thumb-img{width:auto;height:auto;max-width:52%;max-height:52%;object-fit:contain;opacity:1;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
[data-theme="light"] .thumb.mode-icon .thumb-img{filter:drop-shadow(0 6px 14px rgba(17,24,39,.18))}
.thumb.mode-icon .thumb-media{background:radial-gradient(70% 70% at 50% 50%, rgba(255,255,255,.14), transparent 70%)}
.thumb.mode-custom .thumb-img{object-fit:contain;padding:16px}
.thumb.is-fallback .thumb-img{display:none}

.thumb-actions{
  position:absolute;top:18px;right:18px;display:flex;gap:6px;z-index:3;
  opacity:0;transform:translateY(-4px);transition:.2s ease;
}
.tile-wrap:hover .thumb-actions,.tile-wrap:focus-within .thumb-actions{opacity:1;transform:none}
.mini-btn{
  width:28px;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  background:rgba(10,13,20,.55);color:#fff;cursor:pointer;display:grid;place-items:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:0;transition:.18s ease;
}
.mini-btn:hover{background:rgba(10,13,20,.85);transform:scale(1.08)}
.mini-btn.del:hover{background:rgba(220,38,38,.9);border-color:transparent}
.mini-btn svg{width:14px;height:14px}
.tile-meta{display:flex;align-items:baseline;gap:8px;padding:10px 4px 2px}
.tile-name{
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.tile-host{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}

.add-tile{
  border:1.5px dashed var(--border-strong);background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:150px;border-radius:var(--radius);cursor:pointer;font-family:inherit;
  transition:.22s ease;
}
.add-tile:hover{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);transform:translateY(-4px)}
.add-tile .plus{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--field);border:1px solid var(--border)}
.add-tile .plus svg{width:18px;height:18px}
.add-tile span{font-size:13px;font-weight:500}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--muted);display:none}
.empty.show{display:block}
.empty h3{margin:0 0 8px;font-size:17px;color:var(--text-soft);font-weight:600}
.empty p{margin:0 0 20px;font-size:14px}
.no-result{display:none;text-align:center;color:var(--muted);font-size:14px;padding:34px 0}
.no-result.show{display:block}

/* ---------- footer ---------- */
.foot{margin-top:auto;padding-top:24px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  color:var(--muted);font-size:12px}
.foot kbd{font-family:inherit;border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:11px;color:var(--text-soft)}

/* 上下分区：上半区（时钟+搜索）贴顶收缩，卡片在下半区居中 */
.center-area{flex:1;display:flex;flex-direction:column}
.upper{display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:center}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(4,6,10,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:.24s ease;
}
.overlay.open{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:720px;max-height:92vh;overflow:auto;
  background:color-mix(in srgb,var(--bg) 78%,#000 22%);
  border:1px solid var(--border-strong);border-radius:22px;padding:26px 28px 22px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
  transform:translateY(14px) scale(.985);transition:.28s cubic-bezier(.2,.7,.3,1);
}
[data-theme="light"] .modal{background:#fff}
.overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.modal-head h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.modal-body{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:26px}
@media (max-width:660px){.modal-body{grid-template-columns:1fr}.modal{padding:20px}}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:8px;letter-spacing:.01em}
.field .row{display:flex;gap:8px}
input[type=text],input[type=url]{
  width:100%;height:44px;padding:0 14px;border-radius:11px;
  background:var(--field);border:1px solid var(--border);color:var(--text);
  font-size:14px;font-family:inherit;outline:none;transition:.2s ease;
}
input::placeholder{color:var(--muted)}
input[type=text]:focus,input[type=url]:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.mini-action{
  flex:0 0 auto;height:44px;padding:0 13px;border-radius:11px;background:var(--field);border:1px solid var(--border);
  color:var(--text-soft);font-size:12.5px;font-family:inherit;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.2s ease;white-space:nowrap;
}
.mini-action:hover:not(:disabled){border-color:var(--border-strong);color:var(--text)}
.mini-action:disabled{opacity:.55;cursor:progress}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{
  height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);
  font-size:12.5px;font-family:inherit;font-weight:500;cursor:pointer;transition:.18s ease;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 6px 16px -8px var(--accent)}
.preview-wrap{
  background:var(--field);border:1px solid var(--border);border-radius:16px;padding:12px;
}
.preview-label{font-size:11.5px;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.preview-label button{background:none;border:0;color:var(--accent);font-size:11.5px;font-family:inherit;cursor:pointer;padding:0}
.preview-label button:hover{text-decoration:underline}
.preview-empty{
  aspect-ratio:16/10;border-radius:var(--radius-sm);border:1.5px dashed var(--border-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);font-size:12px;text-align:center;padding:0 14px;
}
.preview-empty svg{width:20px;height:20px;opacity:.7}
.preview-meta{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.5;word-break:break-all}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.modal-foot .spacer{margin-right:auto}
.btn{height:42px;padding:0 20px;border-radius:11px;border:1px solid var(--border);background:var(--field);
  color:var(--text);font-size:13.5px;font-family:inherit;font-weight:550;cursor:pointer;transition:.2s ease}
.btn:hover{border-color:var(--border-strong);background:var(--card-hover)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:650}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;min-height:18px}
.status.ok{color:#3ecf8e}
.status.err{color:var(--danger)}
.spin{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* confirm dialog */
.confirm{width:100%;max-width:392px;background:color-mix(in srgb,var(--bg) 80%,#000 20%);border:1px solid var(--border-strong);
  border-radius:20px;padding:26px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
[data-theme="light"] .confirm{background:#fff}
.confirm h3{margin:0 0 8px;font-size:16.5px;font-weight:650}
.confirm p{margin:0 0 22px;font-size:13.5px;color:var(--text-soft);line-height:1.6;word-break:break-all}
.confirm .row{display:flex;justify-content:flex-end;gap:10px}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff;font-weight:650}
.btn.danger:hover{filter:brightness(1.08)}

/* toast */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;
  background:rgba(12,15,22,.92);color:#fff;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 16px 36px -14px rgba(0,0,0,.8);backdrop-filter:blur(10px);
  animation:toast-in .28s cubic-bezier(.2,.7,.3,1);max-width:80vw;
}
[data-theme="light"] .toast{background:rgba(17,24,39,.94)}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s ease}

/* 列数不再写死：由上面的自适应宽度自动决定 */
@media (max-width:600px){
  .shell{padding:16px 16px 34px}
  .grid{gap:14px}
  .top-actions .label{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>

<div class="shell">
  <header class="topbar">
    <div class="brand"><i></i><span>Start Page</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="icon-btn primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">添加网站</span>
      </button>
    </div>
  </header>

  <div class="center-area">
  <div class="upper">
  <section class="hero">
    <div class="clock" id="clock">--:--</div>
    <div class="hero-sub">
      <span class="greet" id="greet">你好</span>
      <span class="dot"></span>
      <span id="today">--</span>
    </div>
  </section>

  <div class="search" id="searchWrap">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="用 Bing 搜索，或输入关键词筛选常用页面…">
    <span class="hint">Bing</span>
    <button class="clear" id="searchClear" aria-label="清空">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  </div>

  <main>
    <section class="grid" id="grid"></section>
    <div class="no-result" id="noResult">没有匹配的快捷方式 · 按 <b>Enter</b> 用 Bing 搜索</div>

      <h3>还没有常用页面</h3>
      <p>点击「添加网站」，输入网址即可自动生成缩略图与名称。</p>
      <button class="btn primary" id="emptyAdd">添加第一个网站</button>
    </div>
  </main>
  </div>

  <footer class="foot">
    <span>拖拽卡片可调整顺序</span>
    <span class="dot">·</span>
    <span>数据保存在本地浏览器</span>
    <span class="dot">·</span>
    <span>按 <kbd>Enter</kbd> 使用 Bing 中国搜索</span>
  </footer>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function () {
  'use strict';

  /* ============ 常量 ============ */
  const KEY_SITES = 'startpage:v1:sites';
  const KEY_THEME = 'startpage:v1:theme';
  const BING_SEARCH = 'https://cn.bing.com/search?q=';
  const SHOT_W = 800, SHOT_H = 500;
  const TITLE_TIMEOUT = 6500;

  const SEED = [
    { url: 'https://github.com',        name: 'GitHub' },
    { url: 'https://www.bilibili.com',  name: '哔哩哔哩' },
    { url: 'https://www.zhihu.com',     name: '知乎' },
    { url: 'https://juejin.cn',         name: '稀土掘金' },
    { url: 'https://mail.google.com',   name: 'Gmail' },
    { url: 'https://www.youtube.com',   name: 'YouTube' }
  ];

  /* ============ 工具 ============ */
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // localStorage 在部分环境（如 Safari 打开本地文件）不可用，降级到内存
  const store = (() => {
    let ok = true;
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
    catch (e) { ok = false; }
    const mem = new Map();
    return {
      persistent: ok,
      get(k) { try { return ok ? localStorage.getItem(k) : (mem.get(k) ?? null); } catch (e) { return mem.get(k) ?? null; } },
      set(k, v) { try { ok ? localStorage.setItem(k, v) : mem.set(k, v); } catch (e) { mem.set(k, v); } }
    };
  })();

  function normalizeUrl(input) {
    let s = String(input || '').trim();
    if (!s) return null;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) {
      if (!/^https?:\/\//i.test(s)) return null;   // 只接受 http/https
    } else {
      s = 'https://' + s.replace(/^\/+/, '');
    }
    try {
      const u = new URL(s);
      if (!u.hostname || !u.hostname.includes('.')) return null;
      if (!/^[a-z0-9.-]+$/i.test(u.hostname)) return null;
      return u.href;
    } catch (e) { return null; }
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  // 从域名推一个像样的名字：news.ycombinator.com -> Ycombinator
  function nameFromUrl(url) {
    const host = hostOf(url);
    if (!host) return '未命名';
    const parts = host.split('.').filter(Boolean);
    const multi = ['com', 'net', 'org', 'gov', 'edu', 'co', 'ac'];
    let label = parts[0];
    if (parts.length >= 3 && multi.includes(parts[parts.length - 2])) label = parts[parts.length - 3];
    else if (parts.length >= 2) label = parts[parts.length - 2];
    if (!label) label = parts[0];
    return label.charAt(0).toUpperCase() + label.slice(1);
  }

  function hueFromHost(host) {
    let h = 0;
    for (let i = 0; i < host.length; i++) h = (h * 31 + host.charCodeAt(i)) % 360;
    return h;
  }

  // 截图源三级链：thum.io（快、支持非标端口）-> microlink -> mShots，任一级失败自动切换
  // bust 非 0 时在各级请求上附加参数，强制绕过缓存
  const shotSources = (url, bust) => {
    const sep = url.includes('?') ? '&' : '?';
    const b = bust ? sep + '_=' + bust : '';
    return [
      `https://image.thum.io/get/width/${SHOT_W}/crop/${SHOT_H}/noanimate/${url}${b}`,
      `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&meta=false&embed=screenshot.url${bust ? `&_b=${bust}` : ''}`,
      `https://s0.wp.com/mshots/v1/${encodeURIComponent(url)}?w=${SHOT_W}&h=${SHOT_H}${bust ? `&_=${bust}` : ''}`
    ];
  };

  const iconChain = host => [
    `https://icon.horse/icon/${host}`,
    `https://www.google.com/s2/favicons?domain=${host}&sz=128`,
    `https://icons.duckduckgo.com/ip3/${host}.ico`
  ];

  function decodeEntities(s) {
    const d = document.createElement('div');
    d.innerHTML = s;
    return d.textContent || '';
  }

  function extractTitle(text) {
    let m = text.match(/<title[^>]*>([\s\S]{1,300}?)<\/title>/i);
    if (m) {
      const t = decodeEntities(m[1]).replace(/\s+/g, ' ').trim();
      if (t) return t;
    }
    m = text.match(/^\s*Title:\s*(.+)$/mi);              // r.jina.ai 的返回格式
    if (m) return m[1].trim();
    m = text.match(/<meta[^>]+(?:property|name)=["'](?:og:site_name|application-name)["'][^>]*content=["']([^"']{1,120})/i);
    if (m) return decodeEntities(m[1]).trim();
    return null;
  }

  async function fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { signal: ctrl.signal, redirect: 'follow' }); }
    finally { clearTimeout(timer); }
  }

  // 多个 CORS 代理依次兜底，任一成功即返回标题
  const TITLE_SOURCES = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    u => `https://r.jina.ai/${u}`
  ];

  async function fetchPageTitle(url) {
    for (const build of TITLE_SOURCES) {
      try {
        const res = await fetchWithTimeout(build(url), TITLE_TIMEOUT);
        if (!res.ok) continue;
        const text = (await res.text()).slice(0, 250000);
        const title = extractTitle(text);
        if (title) return title;
      } catch (e) { /* 换下一个源 */ }
    }
    return null;
  }

  function toast(msg) {
    const box = $('#toasts');
    const t = el('div', 'toast', msg);
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2100);
  }

  /* ============ 状态 ============ */
  let sites = [];
  const failedShots = new Set();   // 本次会话中截图链全部失败的站点
  const shotBust = new Map();      // id -> 「刷新缩略图」时间戳，用于绕过浏览器缓存
  let query = '';

  function load() {
    try {
      const raw = store.get(KEY_SITES);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          sites = arr.filter(s => s && s.url).map(s => ({
            id: s.id || uid(),
            url: s.url,
            name: s.name || nameFromUrl(s.url),
            thumb: {
              mode: ['screenshot', 'icon', 'custom'].includes(s.thumb && s.thumb.mode) ? s.thumb.mode : 'screenshot',
              src: (s.thumb && s.thumb.src) || ''
            }
          }));
          return;
        }
      }
    } catch (e) { /* 数据损坏则重新初始化 */ }
    sites = SEED.map(s => ({ id: uid(), url: s.url, name: s.name, thumb: { mode: 'screenshot', src: '' } }));
    save();
  }

  function save() {
    store.set(KEY_SITES, JSON.stringify(sites));
  }

  /* ============ 缩略图渲染 ============ */
  function buildThumb(site) {
    const host = hostOf(site.url);
    const mode = site.thumb.mode;
    const thumb = el('div', 'thumb mode-' + mode);
    thumb.style.setProperty('--hue', hueFromHost(host));

    const bg = el('div', 'thumb-bg');
    const letter = (site.name || host || '?').trim().charAt(0).toUpperCase();
    bg.appendChild(el('span', 'monogram', letter));

    const media = el('div', 'thumb-media');
    const img = el('img', 'thumb-img');
    img.alt = site.name || host;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    media.appendChild(img);
    thumb.append(bg, media);

    const onLoad = () => img.classList.add('loaded');

    if (mode === 'screenshot') {
      if (failedShots.has(site.id)) {
        useIcon(thumb, img, site, host);
      } else {
        const srcs = shotSources(site.url, shotBust.get(site.id) || '');
        let si = 0;
        img.addEventListener('load', onLoad, { once: true });
        img.addEventListener('error', () => {
          si++;
          if (si < srcs.length) {
            img.src = srcs[si];          // 换下一个截图源
          } else {
            failedShots.add(site.id);    // 全部失败，降级到图标
            useIcon(thumb, img, site, host);
          }
        });
        img.src = srcs[0];
      }
    } else if (mode === 'icon') {
      useIcon(thumb, img, site, host);
    } else if (site.thumb.src) {
      img.addEventListener('load', onLoad, { once: true });
      img.addEventListener('error', () => thumb.classList.add('is-fallback'), { once: true });
      img.src = site.thumb.src;
    } else {
      thumb.classList.add('is-fallback');
    }
    return thumb;
  }

  // 图标三级降级：icon.horse -> Google -> DuckDuckGo -> 首字母底图
  function useIcon(thumb, img, site, host) {
    thumb.classList.remove('mode-screenshot', 'mode-custom', 'is-fallback');
    thumb.classList.add('mode-icon');
    const chain = iconChain(host);
    let i = 0;
    const step = () => {
      if (i >= chain.length) { thumb.classList.add('is-fallback'); return; }
      img.src = chain[i++];
    };
    img.addEventListener('error', step);
    img.classList.add('loaded');
    step();
  }

  /* ============ 渲染 ============ */
  const grid = $('#grid');

  const tileCache = new Map();   // id -> { wrap, tile, nameEl, hostEl, sig }
  let addBtn = null;

  // 缩略图重建签名：仅当相关数据变化时才替换缩略图节点，避免无关卡片图片重新加载
  const thumbSig = site =>
    [site.thumb.mode, site.thumb.src || '', hostOf(site.url), shotBust.get(site.id) || ''].join('|');

  function render() {
    const q = query.trim().toLowerCase();
    let visible = 0;

    sites.forEach(site => {
      const host = hostOf(site.url);
      const haystack = (site.name + ' ' + host + ' ' + site.url).toLowerCase();
      const matched = !q || haystack.includes(q);
      if (matched) visible++;

      let entry = tileCache.get(site.id);
      if (!entry) {
        const wrap = el('div', 'tile-wrap');
        wrap.dataset.id = site.id;

        const tile = el('a', 'tile');
        tile.target = '_blank';
        tile.rel = 'noopener noreferrer';
        tile.draggable = true;
        tile.appendChild(buildThumb(site));

        const meta = el('div', 'tile-meta');
        const nameEl = el('div', 'tile-name', site.name);
        const hostEl = el('div', 'tile-host', host);
        meta.append(nameEl, hostEl);
        tile.appendChild(meta);

        const actions = el('div', 'thumb-actions');
        actions.append(
          miniBtn('编辑', 'edit', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>', () => openModal(site)),
          miniBtn('删除', 'del', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>', () => askDelete(site))
        );

        wrap.append(tile, actions);
        entry = { wrap, tile, nameEl, hostEl, sig: '' };
        tileCache.set(site.id, entry);
      }

      // 就地更新：重新挂载已有节点不会触发图片重新请求
      entry.tile.href = site.url;
      const title = site.name + '\n' + site.url;
      if (entry.tile.title !== title) entry.tile.title = title;
      if (entry.nameEl.textContent !== site.name) entry.nameEl.textContent = site.name;
      if (entry.hostEl.textContent !== host) entry.hostEl.textContent = host;

      const sig = thumbSig(site);
      if (entry.sig !== sig) {
        entry.sig = sig;
        entry.wrap.querySelector('.thumb').replaceWith(buildThumb(site));
      }

      entry.wrap.classList.toggle('hidden', !matched);
      grid.appendChild(entry.wrap);   // 按新顺序重新挂载即完成排序
    });

    // 清理已删除卡片的缓存节点
    for (const [id, entry] of Array.from(tileCache)) {
      if (!sites.some(s => s.id === id)) { entry.wrap.remove(); tileCache.delete(id); }
    }

    if (!addBtn) {
      addBtn = el('button', 'add-tile');
      addBtn.type = 'button';
      addBtn.innerHTML = '<span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>添加网站</span>';
      addBtn.addEventListener('click', () => openModal(null));
    }
    grid.appendChild(addBtn);

    $('#empty').classList.toggle('show', sites.length === 0);
    $('#noResult').classList.toggle('show', sites.length > 0 && visible === 0);
  }

  function miniBtn(label, cls, svg, onClick) {
    const b = el('button', 'mini-btn ' + cls);
    b.type = 'button';
    b.title = label;
    b.setAttribute('aria-label', label);
    b.innerHTML = svg;
    b.addEventListener('click', onClick);
    return b;
  }

  /* ============ 拖拽排序 ============ */
  let dragId = null;

  grid.addEventListener('dragstart', e => {
    const wrap = e.target.closest('.tile-wrap');
    if (!wrap) return;
    dragId = wrap.dataset.id;
    wrap.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* ignore */ }
  });

  grid.addEventListener('dragend', () => {
    dragId = null;
    clearDropMarks();
    const d = grid.querySelector('.tile-wrap.dragging');
    if (d) d.classList.remove('dragging');
  });

  grid.addEventListener('dragover', e => {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const idx = insertionIndex(e.clientX, e.clientY);
    clearDropMarks();
    const tiles = liveTiles();
    if (!tiles.length) return;
    if (idx < tiles.length) tiles[idx].classList.add('drop-before');
    else tiles[tiles.length - 1].classList.add('drop-after');
  });

  grid.addEventListener('drop', e => {
    if (!dragId) return;
    e.preventDefault();
    const idx = insertionIndex(e.clientX, e.clientY);
    moveSite(dragId, idx);
  });

  const liveTiles = () => Array.from(grid.querySelectorAll('.tile-wrap:not(.dragging)'));
  const clearDropMarks = () => grid.querySelectorAll('.drop-before,.drop-after')
    .forEach(n => n.classList.remove('drop-before', 'drop-after'));

  function insertionIndex(x, y) {
    const tiles = liveTiles();
    let idx = tiles.length, best = Infinity;
    tiles.forEach((t, i) => {
      const r = t.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (x - cx) ** 2 + (y - cy) ** 2;
      if (d < best) {
        best = d;
        idx = x < cx ? i : i + 1;
      }
    });
    return idx;
  }

  function moveSite(id, to) {
    const from = sites.findIndex(s => s.id === id);
    if (from < 0) return;
    // to 是"移除被拖卡片之后"的插入槽位（insertionIndex 已在被拖卡片以外的卡片中计算），直接使用
    const [item] = sites.splice(from, 1);
    const target = Math.max(0, Math.min(sites.length, to));
    sites.splice(target, 0, item);
    save();
    render();
  }

  /* ============ 搜索 ============ */
  const searchInput = $('#search');
  const searchWrap = $('#searchWrap');

  searchInput.addEventListener('input', () => {
    query = searchInput.value;
    searchWrap.classList.toggle('has-value', query.length > 0);
    render();
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;   // 中文输入法选词回车不触发搜索
    const v = searchInput.value.trim();
    if (!v) return;
    location.assign(BING_SEARCH + encodeURIComponent(v));
  });

  $('#searchClear').addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    searchWrap.classList.remove('has-value');
    render();
    searchInput.focus();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) &&
        !overlay.classList.contains('open')) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  /* ============ 主题 ============ */
  const themeBtn = $('#themeBtn');
  const themeIcon = $('#themeIcon');
  const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>';

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeIcon.innerHTML = t === 'dark' ? MOON : SUN;
    themeBtn.title = t === 'dark' ? '切换到浅色主题' : '切换到深色主题';
  }
  applyTheme(store.get(KEY_THEME) || 'dark');
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set(KEY_THEME, next);
  });

  /* ============ 时钟 ============ */
  const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  function tick() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    $('#clock').innerHTML = hh + ':' + mm + '<small>' + (d.getHours() < 12 ? 'AM' : 'PM') + '</small>';
    $('#today').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
    const h = d.getHours();
    $('#greet').textContent = h < 5 ? '夜深了' : h < 9 ? '早上好' : h < 12 ? '上午好' :
      h < 14 ? '中午好' : h < 18 ? '下午好' : h < 23 ? '晚上好' : '夜深了';
  }
  tick();
  setInterval(tick, 15000);

  /* ============ 弹窗 ============ */
  const overlay = $('#overlay');
  const form = $('#form');
  const fUrl = $('#fUrl');
  const fName = $('#fName');
  const fImg = $('#fImg');
  const customField = $('#customField');
  const segBtns = Array.from(document.querySelectorAll('#seg button'));
  const previewBox = $('#preview');
  const previewMeta = $('#previewMeta');
  const statusBox = $('#status');
  const fetchNameBtn = $('#fetchName');
  const deleteBtn = $('#deleteBtn');

  let editing = null;         // 正在编辑的站点，null 表示新增
  let draftMode = 'screenshot';
  let nameTouched = false;    // 用户是否手动改过名称
  let autoDerived = false;    // 当前名称是否由域名兜底而来
  let titleReq = 0;           // 请求序号，避免旧结果覆盖新输入
  let autoTimer = null;

  function setStatus(text, kind) {
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
    statusBox.innerHTML = text ? (kind === 'load' ? '<span class="spin"></span>' + text : text) : '';
  }

  function currentDraft() {
    const url = normalizeUrl(fUrl.value);
    return {
      id: editing ? editing.id : 'draft',
      url: url || '',
      name: fName.value.trim() || (url ? nameFromUrl(url) : '') || '未命名',
      thumb: { mode: draftMode, src: draftMode === 'custom' ? fImg.value.trim() : '' }
    };
  }

  function renderPreview() {
    const draft = currentDraft();
    previewBox.textContent = '';
    if (!draft.url) {
      const ph = el('div', 'preview-empty');
      ph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m3 15 4.5-4.5 3.5 3.5L15 9l6 6"/><circle cx="9" cy="8.5" r="1.4"/></svg><span>输入网址后自动生成缩略图</span>';
      previewBox.appendChild(ph);
      previewMeta.textContent = '—';
      return;
    }
    previewBox.appendChild(buildThumb(draft));
    previewMeta.textContent = draft.name + ' · ' + hostOf(draft.url);
  }

  function setMode(mode) {
    draftMode = mode;
    segBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    customField.style.display = mode === 'custom' ? '' : 'none';
    renderPreview();
  }
  segBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  function openModal(site) {
    editing = site || null;
    nameTouched = false;
    autoDerived = false;
    clearTimeout(autoTimer);
    setStatus('');

    // 每次打开都重新给截图一次机会
    const key = editing ? editing.id : 'draft';
    failedShots.delete(key);
    shotBust.delete(key);

    if (site) {
      $('#modalTitle').textContent = '编辑网站';
      fUrl.value = site.url;
      fName.value = site.name;
      fImg.value = site.thumb.src || '';
      setMode(site.thumb.mode);
      deleteBtn.style.display = '';
    } else {
      $('#modalTitle').textContent = '添加网站';
      form.reset();
      fName.value = '';
      fImg.value = '';
      setMode('screenshot');
      deleteBtn.style.display = 'none';
      setStatus('输入网址后会自动获取网页名称');
    }

    overlay.classList.add('open');
    renderPreview();
    setTimeout(() => fUrl.focus(), 120);
  }

  function closeModal() {
    overlay.classList.remove('open');
    editing = null;
    clearTimeout(autoTimer);
    titleReq++;
  }

  // 网址变化 -> 自动补名称 + 刷新预览（输入停顿 700ms 后触发）
  fUrl.addEventListener('input', () => {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      const url = normalizeUrl(fUrl.value);
      if (!url) {
        setStatus(fUrl.value.trim() ? '网址格式不正确，例如 github.com' : '', fUrl.value.trim() ? 'err' : '');
        renderPreview();
        return;
      }
      if (!nameTouched || !fName.value.trim()) { fName.value = nameFromUrl(url); autoDerived = true; }
      renderPreview();
      autoFetchTitle(url);
    }, 700);
  });

  fUrl.addEventListener('blur', () => {
    const url = normalizeUrl(fUrl.value);
    if (url && fUrl.value !== url) fUrl.value = url;
    renderPreview();
  });

  fName.addEventListener('input', () => { nameTouched = true; autoDerived = false; renderPreview(); });
  fImg.addEventListener('input', renderPreview);

  fetchNameBtn.addEventListener('click', () => {
    const url = normalizeUrl(fUrl.value);
    if (!url) { setStatus('请先填写正确的网址', 'err'); return; }
    autoFetchTitle(url);
  });

  async function autoFetchTitle(url) {
    const req = ++titleReq;
    fetchNameBtn.disabled = true;
    setStatus('正在获取网页名称…', 'load');
    const title = await fetchPageTitle(url);
    if (req !== titleReq) return;             // 已被更新的输入取代
    fetchNameBtn.disabled = false;
    if (title) {
      fName.value = title;
      nameTouched = true;
      autoDerived = false;
      setStatus('已获取：' + title, 'ok');
    } else {
      if (!fName.value.trim()) { fName.value = nameFromUrl(url); autoDerived = true; }
      setStatus('未能获取网页名称，已使用域名，可手动修改', 'err');
    }
    renderPreview();
  }

  $('#refreshPreview').addEventListener('click', () => {
    const url = normalizeUrl(fUrl.value);
    if (!url) { setStatus('请先填写正确的网址', 'err'); return; }
    if (draftMode === 'screenshot') {
      const key = editing ? editing.id : 'draft';
      failedShots.delete(key);
      shotBust.set(key, Date.now());   // 附加时间戳绕过缓存，强制重新截图
      render();                         // 差量渲染，只会重建当前这张卡片
    }
    setStatus('已重新加载缩略图', 'ok');
    renderPreview();
  });

  form.addEventListener('submit', e => { e.preventDefault(); saveDraft(); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveDraft(); }
  });

  function saveDraft() {
    const url = normalizeUrl(fUrl.value);
    if (!url) { setStatus('请输入正确的网址，例如 github.com', 'err'); fUrl.focus(); return; }
    if (!fName.value.trim()) { fName.value = nameFromUrl(url); autoDerived = true; }
    const name = fName.value.trim();
    const thumb = { mode: draftMode, src: draftMode === 'custom' ? fImg.value.trim() : '' };
    const wasEditing = !!editing;
    const needTitle = autoDerived;

    let target;
    if (editing) {
      Object.assign(editing, { url, name, thumb });
      target = editing;
    } else {
      target = { id: uid(), url, name, thumb };
      sites.push(target);
    }

    // 地址或缩略图设置变了，给截图链一次重新生成的机会（不附加 bust，未变更的图走缓存）
    failedShots.delete(target.id);
    shotBust.delete(target.id);

    save();
    render();
    closeModal();
    toast(wasEditing ? '已保存修改' : '已添加「' + name + '」');
    if (needTitle) enrichName(target);
  }

  // 名称是用域名兜底生成的，后台再补一次网页标题
  async function enrichName(site) {
    const title = await fetchPageTitle(site.url);
    if (!title) return;
    if (!sites.some(s => s.id === site.id)) return;   // 期间已被删除
    site.name = title;
    save();
    render();
  }

  $('#addBtn').addEventListener('click', () => openModal(null));
  $('#emptyAdd').addEventListener('click', () => openModal(null));
  $('#closeBtn').addEventListener('click', closeModal);
  $('#cancelBtn').addEventListener('click', closeModal);

  overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeModal(); });

  /* ============ 删除确认 ============ */
  const confirmOverlay = $('#confirmOverlay');
  let pendingDelete = null;

  function askDelete(site) {
    pendingDelete = site;
    $('#confirmText').textContent = site.name + '（' + hostOf(site.url) + '）';
    confirmOverlay.classList.add('open');
  }
  $('#confirmCancel').addEventListener('click', () => { confirmOverlay.classList.remove('open'); pendingDelete = null; });
  $('#confirmOk').addEventListener('click', () => {
    if (!pendingDelete) return;
    const name = pendingDelete.name;
    sites = sites.filter(s => s.id !== pendingDelete.id);
    save();
    render();
    confirmOverlay.classList.remove('open');
    if (editing && editing.id === pendingDelete.id) closeModal();
    pendingDelete = null;
    toast('已删除「' + name + '」');
  });
  confirmOverlay.addEventListener('mousedown', e => { if (e.target === confirmOverlay) { confirmOverlay.classList.remove('open'); pendingDelete = null; } });
  deleteBtn.addEventListener('click', () => { if (editing) askDelete(editing); });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (confirmOverlay.classList.contains('open')) { confirmOverlay.classList.remove('open'); pendingDelete = null; return; }
    if (overlay.classList.contains('open')) closeModal();
  });

  /* ============ 启动 ============ */
  load();
  render();
  if (!store.persistent) toast('当前环境无法使用本地存储，本次改动仅在页面内有效');
})();
</script>
</body>
</html>
